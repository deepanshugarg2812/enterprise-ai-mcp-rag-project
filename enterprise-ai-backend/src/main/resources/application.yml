spring:
  application:
    name: enterprise-ai-backend

  ai:
    ollama:
      base-url: http://localhost:11434

      chat:
        options:
          model: llama3.2
          temperature: 0.2

    mcp:
      client:
        type: SYNC

        streamable-http:
          connections:
            enterprise-mcp:
              url: http://localhost:8081

server:
  port: 8083

rag:
  base-url: http://localhost:8082