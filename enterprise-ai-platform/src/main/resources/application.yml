spring:
  application:
    name: enterprise-ai-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/enterprise_ai
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html